<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="https://kit.fontawesome.com/9865fe30cd.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="headerWrapper">
    <h1>Calculator</h1>
    <h2>Solve Any Problem!</h2>
    </div>
    <div id="outerCalculator">
        <input id="inputCalculator" readonly>
        <div id="buttonsCalculator">
            <button class="calcBtn" onclick="appendToDisplay('1')">1</button>
            <button class="calcBtn" onclick="appendToDisplay('2')">2</button>
            <button class="calcBtn" onclick="appendToDisplay('3')">3</button>
            <button class="calcBtn" onclick="appendToDisplay('+')">+</button>
            <button class="calcBtn" onclick="appendToDisplay('4')">4</button>
            <button class="calcBtn" onclick="appendToDisplay('5')">5</button>
            <button class="calcBtn" onclick="appendToDisplay('6')">6</button>
            <button class="calcBtn" onclick="appendToDisplay('-')">-</button>
            <button class="calcBtn" onclick="appendToDisplay('7')">7</button>
            <button class="calcBtn" onclick="appendToDisplay('8')">8</button>
            <button class="calcBtn" onclick="appendToDisplay('9')">9</button>
            <button class="calcBtn" onclick="appendToDisplay('*')">x</button>
            <button class="calcBtn" onclick="clearDisplay()">C</button>
            <button class="calcBtn" onclick="appendToDisplay('0')">0</button>
            <button class="calcBtn" onclick="calculate()">=</button>
            <button class="calcBtn" onclick="appendToDisplay('/')">/</button>
    </div>
    </div>
    <footer id="footer">
        <button id="backButton" onclick="location.href='index.html'">Go Back</button>
        <button id="settingsButton"><i class="fa-solid fa-gear"></i></button>
    </footer>
    <script src="calculator.js"></script>
</body>
</html>
